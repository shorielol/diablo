<h1>Deadweight loss under a price floor</h1>
<div class="rule"></div>
<ul>
  <li>A binding floor sits above the market-clearing price.</li>
  <li>Quantity supplied exceeds quantity demanded.</li>
  <li>The surplus that neither side captures is lost.</li>
</ul>
